<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Disney 2026 Planner</title><style>body{font:15px system-ui;background:#f3f7fb;color:#173448;margin:0}header{background:#12577a;color:white;padding:22px}main{max-width:1200px;margin:auto;padding:20px}nav{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}button,select,input{padding:10px;border:1px solid #aac3d3;border-radius:7px;background:white}button{cursor:pointer}.active{background:#12577a;color:white}table{border-collapse:collapse;width:100%;background:white}th,td{padding:10px;text-align:left;border-bottom:1px solid #dce6ed}th{background:#e5f1f7}.good{color:#067647;font-weight:bold}.warn{color:#8c5500}#status{padding:12px}.wrap{overflow:auto}small{color:#526575}</style><header><h1>Disney 2026 Family Planner</h1>Alberto · Aria · Me | November 24–28, 2026</header><main><nav id="days"></nav><p id="anchors"></p><nav><select id="filter"><option value="3">All three checked</option><option value="2">Two or more checked</option><option value="1">Anyone checked</option><option value="0">All experiences</option></select><input id="search" placeholder="Search experiences"><button id="refresh">Refresh live data</button></nav><div id="status"></div><div class="wrap"><table><thead><tr><th>Experience</th><th>Height</th><th>Alberto</th><th>Aria</th><th>Me</th><th>Wait</th><th>Status</th></tr></thead><tbody id="rows"></tbody></table></div><p><small>Live data from <a href="https://themeparks.wiki/">ThemeParks.wiki</a>. No future wait forecast is available in this starter. Verify attraction names and preferences against original checklists.</small></p></main><script>
const API='https://api.themeparks.wiki/v1';let plan,rows=[],parkIds={},live={};let day=0;
const el=id=>document.getElementById(id),norm=s=>(s||'').toLowerCase().replace(/[^a-z0-9]/g,'');
async function get(url){const r=await fetch(url);if(!r.ok)throw Error(r.status+' '+url);return r.json()}
function parseCSV(t){const result=[];let row=[],s='',quoted=false;for(let i=0;i<t.length;i++){const c=t[i];if(c==='"'){if(quoted&&t[i+1]==='"'){s+='"';i++}else quoted=!quoted}else if(c===','&&!quoted){row.push(s);s=''}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&t[i+1]==='\n')i++;row.push(s);if(row.some(Boolean))result.push(row);row=[];s=''}else s+=c}if(s||row.length){row.push(s);result.push(row)}const h=result.shift();return result.map(a=>Object.fromEntries(h.map((k,i)=>[k,a[i]||''])))}
function draw(){const d=plan.days[day];el('days').innerHTML='';plan.days.forEach((v,i)=>{let b=document.createElement('button');b.textContent=v.date.slice(5)+' '+v.park;b.className=i===day?'active':'';b.onclick=()=>{day=i;live={};draw();refresh()};el('days').append(b)});
el('anchors').textContent='Fixed plans: '+d.anchors.join(' · ');
const filtered=rows.filter(r=>r.Park===d.park&&['Alberto','Aria','Me'].filter(p=>r[p]==='Yes').length>=+el('filter').value&&r.Experience.toLowerCase().includes(el('search').value.toLowerCase())).sort((a,b)=>['Alberto','Aria','Me'].filter(p=>b[p]==='Yes').length-['Alberto','Aria','Me'].filter(p=>a[p]==='Yes').length);
el('rows').replaceChildren();for(const r of filtered){const tr=document.createElement('tr');const item=live[r['ThemeParks entity ID']]||live[norm(r.Experience)]||{};const wait=item.queue?.STANDBY?.waitTime;for(const val of [r.Experience,r['Min height (in)']||'—',...['Alberto','Aria','Me'].map(p=>r[p]==='Yes'?'✓':'—'),Number.isFinite(wait)?wait+' min':'—',item.status||'Not tracked']){const td=document.createElement('td');td.textContent=val;if(val==='✓')td.className='good';tr.append(td)}el('rows').append(tr)}
el('status').textContent=filtered.length+' experiences shown · '+rows.length+' imported total';}
async function refresh(){const id=parkIds[plan.days[day].park];if(!id){el('status').textContent+=' · Park ID unavailable';return}try{const data=await get(API+'/entity/'+id+'/live');live={};for(const r of data.liveData||[]){live[r.id]=r;live[norm(r.name)]=r}draw();el('status').textContent+=' · Live data updated '+new Date().toLocaleTimeString()}catch(e){el('status').textContent+=' · Live data unavailable: '+e.message}}
async function init(){plan=await get('./plan.json');try{rows=parseCSV(await (await fetch('./choices.csv')).text())}catch(e){el('status').textContent='Import choices.csv from spreadsheet to populate experiences'}try{const d=await get(API+'/destinations');const dest=(Array.isArray(d)?d:d.destinations||[]).find(x=>/Walt Disney World/i.test(x.name));if(dest){const c=await get(API+'/entity/'+dest.id+'/children');for(const p of ['Hollywood Studios','Animal Kingdom','Magic Kingdom','EPCOT']){const v=(c.children||[]).find(x=>x.name.toLowerCase().includes(p.toLowerCase()));if(v)parkIds[p]=v.id}}}catch(e){}draw();refresh()}el('filter').onchange=draw;el('search').oninput=draw;el('refresh').onclick=refresh;init();
</script></html>

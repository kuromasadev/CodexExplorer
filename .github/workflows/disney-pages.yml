
name: Deploy Disney 2026 Dashboard

on:
  push:
    branches:
      - main
    paths:
      - 'disney-26/**'
      - '.github/workflows/disney-pages.yml'

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: disney-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Disney dashboard
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./disney-26

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
